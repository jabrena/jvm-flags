<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java JVM Flags</title>
  <script src="scripts/d3.v7.min.js"></script>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" type="image/png" href="images/java-icon.png">
</head>
<body class="page-java-version">
  <header>
    <a href="index.html" class="back-link" aria-label="Back">← Back</a>
    <h1><span id="title-version">Java 25</span> JVM Flags</h1>
    <label class="view-toggle" for="table-view">
      <input type="checkbox" id="table-view" aria-controls="table-wrap flags-table">
      Table
    </label>
    <fieldset class="jvm-filter" aria-label="JVM implementation">
      <label class="jvm-filter-option">
        <input type="radio" name="jvm-filter" value="hotspot" checked>
        HotSpot
      </label>
      <label class="jvm-filter-option">
        <input type="radio" name="jvm-filter" value="graalvm">
        GraalVM
      </label>
    </fieldset>
    <div class="stats" id="stats">Loading graph…</div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot legend-dot--root"></span>Root</div>
      <div class="legend-item"><span class="legend-dot legend-dot--domain"></span>Domain</div>
      <div class="legend-item"><span class="legend-dot legend-dot--category"></span>Category</div>
      <div class="legend-item"><span class="legend-dot legend-dot--subcategory"></span>Subcategory</div>
      <div class="legend-item"><span class="legend-dot legend-dot--flag"></span>Flag</div>
      <span class="legend-hint">· click to expand each level</span>
    </div>
  </header>

  <div id="error" class="error" hidden></div>
  <svg id="graph"></svg>
  <div class="tooltip" id="tooltip"></div>
  <div id="table-wrap" class="table-wrap" hidden>
    <table id="flags-table" class="flags-table">
      <thead>
        <tr>
          <th scope="col" id="domain-col">Domain</th>
          <th scope="col" id="category-col">Category</th>
          <th scope="col" id="subcategory-col">Subcategory</th>
          <th scope="col">Flag</th>
        </tr>
      </thead>
      <tbody id="flags-table-body"></tbody>
    </table>
  </div>

  <script>
    const COLORS = {
      root: "#f59e0b",
      domain: "#ec4899",
      category: "#3b82f6",
      subcategory: "#a78bfa",
      flag: "#34d399"
    };

    const RADII = {
      root: 18,
      domain: 14,
      category: 11,
      subcategory: 8,
      flag: 4
    };

    const DEFAULT_LTS = "25";
    const DEFAULT_JVM = "hotspot";
    const JVM_FILTER_VALUES = ["hotspot", "graalvm"];

    function resolveJavaVersion() {
      const java = new URLSearchParams(window.location.search).get("java");
      if (java == null || String(java).trim() === "") return DEFAULT_LTS;
      const version = String(java).trim();
      return /^\d+$/.test(version) ? version : DEFAULT_LTS;
    }

    function dataUrlForVersion(version) {
      return `json/java-${version}.json`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const JAVA_VERSION = resolveJavaVersion();
    const DATA_URL = dataUrlForVersion(JAVA_VERSION);

    const jvmParam = urlParams.get("jvm");
    let JVM_FILTER =
      jvmParam != null && JVM_FILTER_VALUES.includes(String(jvmParam).trim().toLowerCase())
        ? String(jvmParam).trim().toLowerCase()
        : DEFAULT_JVM;

    let rawCatalogData = null;
    const jvmFilterRadios = document.querySelectorAll('input[name="jvm-filter"]');

    function jvmFilterLabel() {
      return JVM_FILTER === "graalvm" ? "GraalVM" : "HotSpot";
    }

    function flagSupportsJvm(node) {
      const implementations = node.jvm;
      if (!implementations || !Array.isArray(implementations)) {
        return JVM_FILTER === "hotspot";
      }
      return implementations.includes(JVM_FILTER);
    }

    function updateJvmTitle() {
      document.getElementById("title-version").textContent =
        `Java ${JAVA_VERSION} · ${jvmFilterLabel()}`;
      document.title = `Java ${JAVA_VERSION} · ${jvmFilterLabel()} JVM Flags — Graph`;
    }

    function syncJvmToUrl() {
      const params = new URLSearchParams(window.location.search);
      if (JVM_FILTER === DEFAULT_JVM) {
        params.delete("jvm");
      } else {
        params.set("jvm", JVM_FILTER);
      }
      const query = params.toString();
      const next = query
        ? `${window.location.pathname}?${query}`
        : window.location.pathname;
      window.history.replaceState(null, "", next);
    }

    function setJvmFilterRadios() {
      for (const radio of jvmFilterRadios) {
        radio.checked = radio.value === JVM_FILTER;
      }
    }

    function applyJvmFilter() {
      updateJvmTitle();
      syncJvmToUrl();
      if (rawCatalogData) {
        const tableView = tableViewCb.checked;
        initGraph(rawCatalogData);
        if (tableView) {
          setTableView(true);
        }
      }
    }

    setJvmFilterRadios();
    updateJvmTitle();

    for (const radio of jvmFilterRadios) {
      radio.addEventListener("change", () => {
        if (!radio.checked) return;
        JVM_FILTER = radio.value;
        applyJvmFilter();
      });
    }

    const svg = d3.select("#graph");
    const tooltip = d3.select("#tooltip");
    const errorEl = document.getElementById("error");
    const statsEl = document.getElementById("stats");
    const tableViewCb = document.getElementById("table-view");
    const tableWrap = document.getElementById("table-wrap");
    const tableBody = document.getElementById("flags-table-body");
    const domainCol = document.getElementById("domain-col");
    const subcategoryCol = document.getElementById("subcategory-col");
    let simulation, g, linkSel, nodeSel, labelSel, zoomBehavior, container;
    let cachedGraphData = null;
    let allNodes = [];
    let allLinks = [];
    let nodeById = new Map();
    let childrenByParent = new Map();
    let parentByChild = new Map();
    let expanded = new Set();
    let graphWidth = 0;
    let graphHeight = 0;
    let adjacency = new Map();

    function showError(msg) {
      statsEl.textContent = "";
      errorEl.hidden = false;
      errorEl.innerHTML = msg;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function radius(d) {
      return RADII[d.type] || 5;
    }

    function color(d) {
      return COLORS[d.type] || "#64748b";
    }

    function buildAdjacency(nodes, links) {
      const map = new Map(nodes.map(n => [n.id, new Set()]));
      for (const l of links) {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        map.get(s)?.add(t);
        map.get(t)?.add(s);
      }
      return map;
    }

    function buildTreeMaps(links) {
      childrenByParent = new Map();
      parentByChild = new Map();
      for (const l of links) {
        const s = l.source.id ?? l.source;
        const t = l.target.id ?? l.target;
        if (!childrenByParent.has(s)) childrenByParent.set(s, []);
        childrenByParent.get(s).push(t);
        parentByChild.set(t, s);
      }
    }

    function hasChildren(id) {
      return (childrenByParent.get(id) || []).length > 0;
    }

    function isVisible(node) {
      if (node.type === "root" || node.type === "domain") return true;
      if (node.type === "category") {
        const domainId = node.parent || parentByChild.get(node.id);
        return domainId != null && expanded.has(domainId);
      }
      if (node.type === "subcategory") {
        const categoryId = node.parent || parentByChild.get(node.id);
        if (categoryId == null || !expanded.has(categoryId)) return false;
        const category = nodeById.get(categoryId);
        return category != null && isVisible(category);
      }
      if (node.type === "flag") {
        const subId = parentByChild.get(node.id);
        if (subId == null || !expanded.has(subId)) return false;
        const sub = nodeById.get(subId);
        return sub != null && isVisible(sub);
      }
      return false;
    }

    function isLinkVisible(link) {
      return isVisible(link.source) && isVisible(link.target);
    }

    function collapseDescendants(id) {
      for (const childId of childrenByParent.get(id) || []) {
        expanded.delete(childId);
        collapseDescendants(childId);
      }
    }

    function toggleExpand(node) {
      if (!hasChildren(node.id)) return;
      if (expanded.has(node.id)) {
        expanded.delete(node.id);
        collapseDescendants(node.id);
      } else {
        expanded.add(node.id);
      }
      updateVisibility();
    }

    function truncateLabel(text, maxLen) {
      if (text.length <= maxLen) return text;
      return text.slice(0, maxLen - 1) + "…";
    }

    function nodeDisplayLabel(d) {
      const label = truncateLabel(d.label, 28);
      if ((d.type === "domain" || d.type === "category" || d.type === "subcategory") && hasChildren(d.id)) {
        return `${label} ${expanded.has(d.id) ? "▾" : "▸"}`;
      }
      return label;
    }

    function flagDisplayLabel(d) {
      return truncateLabel(d.flag || d.label, 36);
    }

    function updateStats() {
      if (tableViewCb.checked) return;
      const domains = allNodes.filter(n => n.type === "domain").length;
      const categories = allNodes.filter(n => n.type === "category" && isVisible(n)).length;
      const subcategories = allNodes.filter(n => n.type === "subcategory" && isVisible(n)).length;
      const flags = allNodes.filter(n => n.type === "flag" && isVisible(n)).length;
      const parts = [`${domains} domains`];
      if (categories > 0) parts.push(`${categories} categories`);
      if (subcategories > 0) parts.push(`${subcategories} subcategories`);
      if (flags > 0) parts.push(`${flags} flags`);
      parts.push("click to expand");
      statsEl.textContent = parts.join(" · ");
    }

    function updateVisibility() {
      if (!nodeSel || !linkSel) return;

      nodeSel.classed("collapsed", d => !isVisible(d));
      linkSel.classed("collapsed", d => !isLinkVisible(d));

      labelSel
        .filter(d => d.type === "domain" || d.type === "category" || d.type === "subcategory")
        .text(nodeDisplayLabel);

      nodeSel.classed("expanded", d => expanded.has(d.id));

      const visibleNodes = allNodes.filter(isVisible);
      const visibleLinks = allLinks.filter(isLinkVisible);

      simulation.nodes(visibleNodes);
      simulation.force("link").links(visibleLinks);
      simulation.alpha(0.4).restart();

      updateStats();
    }

    function getConnected(id) {
      const visited = new Set([id]);
      const queue = [id];
      while (queue.length) {
        const cur = queue.shift();
        for (const next of adjacency.get(cur) || []) {
          if (!visited.has(next)) {
            visited.add(next);
            queue.push(next);
          }
        }
      }
      return visited;
    }

    function highlightNode(d) {
      if (!isVisible(d)) return;
      if (d.type === "flag") {
        nodeSel.classed("dimmed", n => !isVisible(n) || n.id !== d.id);
        nodeSel.classed("highlight", n => n.id === d.id);
        linkSel.classed("highlight", false).classed("dimmed", true);
        return;
      }
      const connected = getConnected(d.id);
      nodeSel.classed("dimmed", n => !isVisible(n) || !connected.has(n.id));
      nodeSel.classed("highlight", n => n.id === d.id);
      linkSel
        .classed("highlight", l => isLinkVisible(l) && connected.has(l.source.id) && connected.has(l.target.id))
        .classed("dimmed", l => !isLinkVisible(l) || !(connected.has(l.source.id) && connected.has(l.target.id)));
    }

    function clearHighlight() {
      nodeSel.classed("dimmed highlight", false);
      linkSel.classed("highlight dimmed", false);
    }

    function showTooltip(event, d) {
      if (d.type === "flag") return;
      const label = escapeHtml(d.label);
      const type = escapeHtml(d.type);

      tooltip
        .classed("visible", true)
        .classed("flag-only", false)
        .style("left", `${event.clientX + 14}px`)
        .style("top", `${event.clientY + 14}px`)
        .html(`<div class="type">${type}</div>
               <div class="label">${label}</div>
               ${d.flag ? `<div class="flag">${escapeHtml(d.flag)}</div>` : ""}`);
    }

    function flagDetailUrl(d) {
      const flagId = d.flagId || d.id;
      const params = new URLSearchParams({
        java: JAVA_VERSION,
        flag: flagId
      });
      if (JVM_FILTER !== DEFAULT_JVM) {
        params.set("jvm", JVM_FILTER);
      }
      return `jvm-flag.html?${params}`;
    }

    function hideTooltip() {
      tooltip.classed("visible flag-only", false);
    }

    function buildParentMapFromEdges(edges) {
      const parent = new Map();
      for (const e of edges) {
        parent.set(e.target, e.source);
      }
      return parent;
    }

    /** Keep only flag nodes supported by the active JVM filter (HotSpot by default). */
    function filterCatalogByJvm(data) {
      const nodesById = new Map(data.nodes.map(n => [n.id, n]));
      const keepFlagIds = new Set(
        data.nodes
          .filter(n => n.type === "flag" && flagSupportsJvm(n))
          .map(n => n.id)
      );
      return {
        ...data,
        nodes: data.nodes.filter(n => n.type !== "flag" || keepFlagIds.has(n.id)),
        edges: data.edges.filter(e => {
          const target = nodesById.get(e.target);
          return target?.type !== "flag" || keepFlagIds.has(e.target);
        })
      };
    }

    /** Drop domains/categories/subcategories with no flags on this Java version. */
    function pruneEmptyContainers(data) {
      const nodesById = new Map(data.nodes.map(n => [n.id, n]));
      const flagCountBySource = new Map();

      for (const e of data.edges) {
        const source = nodesById.get(e.source);
        const target = nodesById.get(e.target);
        if (!source || !target || target.type !== "flag") continue;
        if (source.type === "subcategory" || source.type === "category") {
          flagCountBySource.set(e.source, (flagCountBySource.get(e.source) || 0) + 1);
        }
      }

      const activeSubcategories = new Set(
        data.nodes
          .filter(n => n.type === "subcategory" && (flagCountBySource.get(n.id) || 0) > 0)
          .map(n => n.id)
      );

      const activeCategories = new Set(
        data.nodes
          .filter(n => {
            if (n.type !== "category") return false;
            if ((flagCountBySource.get(n.id) || 0) > 0) return true;
            return data.edges.some(
              e => e.source === n.id && activeSubcategories.has(e.target)
            );
          })
          .map(n => n.id)
      );

      const activeDomains = new Set(
        data.nodes
          .filter(n => {
            if (n.type !== "domain") return false;
            return data.edges.some(
              e => e.source === n.id && activeCategories.has(e.target)
            );
          })
          .map(n => n.id)
      );

      const keepIds = new Set(["root", ...activeDomains, ...activeCategories, ...activeSubcategories]);
      for (const n of data.nodes) {
        if (n.type === "flag") keepIds.add(n.id);
      }

      return {
        ...data,
        nodes: data.nodes.filter(n => keepIds.has(n.id)),
        edges: data.edges.filter(e => keepIds.has(e.source) && keepIds.has(e.target))
      };
    }


    /** Graph view: full hierarchy; visibility controlled by expand/collapse. */
    function graphStructure(data) {
      const graphTypes = new Set(["root", "domain", "category", "subcategory", "flag"]);
      const nodes = data.nodes.filter(n => graphTypes.has(n.type));
      const nodeIds = new Set(nodes.map(n => n.id));
      const edges = data.edges.filter(
        e => nodeIds.has(e.source) && nodeIds.has(e.target)
      );
      return { nodes, edges };
    }

    function buildFlagRows(nodes, edges) {
      const nodesById = new Map(nodes.map(n => [n.id, n]));
      const parentByTarget = buildParentMapFromEdges(edges);
      const rows = [];

      for (const node of nodes) {
        if (node.type !== "flag") continue;

        let domain = "";
        let category = "";
        let subcategory = "";
        let cur = parentByTarget.get(node.id);
        while (cur) {
          const parent = nodesById.get(cur);
          if (!parent) break;
          if (parent.type === "subcategory") subcategory = parent.label;
          else if (parent.type === "category") category = parent.label;
          else if (parent.type === "domain") domain = parent.label;
          cur = parentByTarget.get(cur);
        }

        rows.push({
          domain,
          category,
          subcategory,
          flag: node.flag || node.label,
          flagId: node.flagId || node.id
        });
      }

      rows.sort((a, b) => {
        const d = a.domain.localeCompare(b.domain);
        if (d !== 0) return d;
        const c = a.category.localeCompare(b.category);
        if (c !== 0) return c;
        const s = a.subcategory.localeCompare(b.subcategory);
        if (s !== 0) return s;
        return a.flag.localeCompare(b.flag);
      });

      return rows;
    }

    function renderTable(data) {
      const rows = buildFlagRows(data.nodes, data.edges);
      const hasDomain = rows.some(r => r.domain);
      const hasSubcategory = rows.some(r => r.subcategory);

      domainCol.hidden = !hasDomain;
      subcategoryCol.hidden = !hasSubcategory;
      tableBody.innerHTML = rows.map(r => {
        const domainCell = hasDomain
          ? `<td class="domain">${escapeHtml(r.domain)}</td>`
          : "";
        const subCell = hasSubcategory
          ? (r.subcategory
              ? `<td class="subcategory">${escapeHtml(r.subcategory)}</td>`
              : `<td class="empty-cell">—</td>`)
          : "";
        const href = flagDetailUrl({ flagId: r.flagId });
        return `<tr>
          ${domainCell}
          <td class="category">${escapeHtml(r.category)}</td>
          ${subCell}
          <td><a class="flag-link" href="${escapeHtml(href)}">${escapeHtml(r.flag)}</a></td>
        </tr>`;
      }).join("");

      if (tableViewCb.checked) {
        statsEl.textContent = `${rows.length} flags · click a flag for details`;
      }
    }

    function setTableView(enabled) {
      document.body.classList.toggle("table-view", enabled);
      tableWrap.hidden = !enabled;
      hideTooltip();

      if (enabled) {
        if (cachedGraphData) {
          renderTable(cachedGraphData);
        }
        if (simulation) simulation.stop();
      } else {
        updateStats();
        if (simulation) simulation.alpha(0.1).restart();
      }
    }



    tableViewCb.addEventListener("change", () => setTableView(tableViewCb.checked));

    function initGraph(data) {
      errorEl.hidden = true;

      const fullData = pruneEmptyContainers(filterCatalogByJvm(data));
      cachedGraphData = fullData;

      const version = fullData.metadata?.version || JAVA_VERSION;
      document.getElementById("title-version").textContent =
        `Java ${version} · ${jvmFilterLabel()}`;
      document.title = `${fullData.metadata?.title || `Java ${version} · ${jvmFilterLabel()} JVM Flags`} — Graph`;

      const width = window.innerWidth;
      const height = window.innerHeight - 52;

      const graphData = graphStructure(fullData);
      const nodes = graphData.nodes.map(d => ({ ...d }));
      nodeById = new Map(nodes.map(n => [n.id, n]));
      const links = graphData.edges.map(e => ({
        source: nodeById.get(e.source),
        target: nodeById.get(e.target)
      })).filter(l => l.source && l.target);

      allNodes = nodes;
      allLinks = links;
      expanded = new Set();
      adjacency = buildAdjacency(nodes, links);
      buildTreeMaps(links);

      graphWidth = width;
      graphHeight = height;

      svg.selectAll("*").remove();

      container = svg
        .attr("viewBox", [0, 0, width, height])
        .attr("width", width)
        .attr("height", height);

      g = container.append("g");

      zoomBehavior = d3.zoom()
        .scaleExtent([0.15, 4])
        .on("zoom", (event) => g.attr("transform", event.transform));

      container.call(zoomBehavior);

      linkSel = g.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("class", "link");

      nodeSel = g.append("g")
        .attr("class", "nodes")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", d => `node ${d.type}`)
        .call(d3.drag()
          .filter((event, d) => d.type !== "flag")
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended))
        .on("pointerenter", (event, d) => {
          highlightNode(d);
          showTooltip(event, d);
        })
        .on("pointermove", (event) => {
          tooltip
            .style("left", `${event.clientX + 14}px`)
            .style("top", `${event.clientY + 14}px`);
        })
        .on("pointerleave", () => {
          clearHighlight();
          hideTooltip();
        })
        .on("click", (event, d) => {
          event.stopPropagation();
          if (d.type === "domain" || d.type === "category" || d.type === "subcategory") {
            toggleExpand(d);
            return;
          }
          if (d.type === "flag" && (d.flagId || d.id)) {
            window.location.href = flagDetailUrl(d);
          }
        });

      nodeSel.append("circle")
        .attr("r", radius)
        .attr("fill", color);

      nodeSel.filter(d => d.type === "flag")
        .append("circle")
        .attr("class", "hit-area")
        .attr("r", 14);

      labelSel = nodeSel.append("text")
        .attr("dy", d => radius(d) + (d.type === "flag" ? 10 : 12))
        .attr("text-anchor", "middle")
        .text(d => d.type === "flag" ? flagDisplayLabel(d) : nodeDisplayLabel(d));

      nodeSel.classed("expandable", d =>
        (d.type === "domain" || d.type === "category" || d.type === "subcategory") && hasChildren(d.id)
      );

      const initialNodes = nodes.filter(isVisible);
      const initialLinks = links.filter(isLinkVisible);

      simulation = d3.forceSimulation(initialNodes)
        .force("link", d3.forceLink(initialLinks)
          .id(d => d.id)
          .distance(d => {
            const st = d.source.type;
            const tt = d.target.type;
            if (st === "root" || tt === "root") return 100;
            if (st === "domain" || tt === "domain") return 85;
            if (st === "category" || tt === "category") return 65;
            if (st === "subcategory" || tt === "subcategory") return 48;
            return 35;
          })
          .strength(0.85))
        .force("charge", d3.forceManyBody()
          .strength(d => {
          if (d.type === "root") return -900;
          if (d.type === "flag") return -40;
          if (d.type === "domain") return -320;
          return -200;
        }))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d =>
          d.type === "flag" ? radius(d) + 42 : radius(d) + 6
        ))
        .force("x", d3.forceX(width / 2).strength(0.03))
        .force("y", d3.forceY(height / 2).strength(0.03))
        .on("tick", ticked);

      container.on("click", clearHighlight);

      updateVisibility();
      renderTable(fullData);

      function ticked() {
        linkSel
          .attr("x1", d => isLinkVisible(d) ? d.source.x : 0)
          .attr("y1", d => isLinkVisible(d) ? d.source.y : 0)
          .attr("x2", d => isLinkVisible(d) ? d.target.x : 0)
          .attr("y2", d => isLinkVisible(d) ? d.target.y : 0);

        nodeSel.attr("transform", d =>
          isVisible(d) && d.x != null ? `translate(${d.x},${d.y})` : null
        );
      }

      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }

      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }

      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }

      window.addEventListener("resize", () => {
        graphWidth = window.innerWidth;
        graphHeight = window.innerHeight - 52;
        svg.attr("viewBox", [0, 0, graphWidth, graphHeight])
          .attr("width", graphWidth)
          .attr("height", graphHeight);
        simulation.force("center", d3.forceCenter(graphWidth / 2, graphHeight / 2));
        simulation.force("x", d3.forceX(graphWidth / 2).strength(0.03));
        simulation.force("y", d3.forceY(graphHeight / 2).strength(0.03));
        simulation.alpha(0.3).restart();
      });
    }

    d3.json(DATA_URL)
      .then(data => {
        if (!data?.nodes?.length) throw new Error("Invalid graph data");
        rawCatalogData = data;
        initGraph(data);
      })
      .catch(err => {
        console.error(err);
        showError(
          `Could not load <code>${DATA_URL}</code> (Java ${JAVA_VERSION}).<br>` +
          `Serve the <code>docs/</code> folder over HTTP (e.g. <code>python3 -m http.server 8080 --directory docs</code>)<br>` +
          `then open <code>http://localhost:8080/java-version.html?java=${JAVA_VERSION}</code>`
        );
      });
  </script>
