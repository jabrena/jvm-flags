<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVM Flags - Home</title>
  <script src="scripts/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #f59e0b;
      --lts: #fbbf24;
      --line: #3d4f66;
      --card: #15202b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }

    .header-title-row h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .header-title-row .btn-graph {
      width: auto;
      flex-shrink: 0;
      white-space: nowrap;
      padding: 0.5rem 0.85rem;
      font-size: 0.85rem;
    }

    .header-separator {
      margin: 0.65rem -1rem 0;
    }

    header p {
      margin-top: 0.55rem;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.45;
      max-width: 52rem;
    }

    header p + p {
      margin-top: 0.5rem;
    }

    .header-section {
      margin-top: 1rem;
    }

    .header-section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .header-section p {
      margin-top: 0;
    }

    header code {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      font-size: 0.8em;
      color: var(--text);
      background: var(--bg);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      padding: 0.55rem 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .legend-bar span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.release { background: #3b82f6; }
    .dot.lts {
      background: var(--lts);
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.35);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .timeline-viewport {
      position: relative;
      flex: 0 0 auto;
    }

    .edge-fade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.25rem;
      pointer-events: none;
      z-index: 2;
    }

    .edge-fade--left {
      left: 0;
      background: linear-gradient(90deg, var(--bg) 25%, transparent);
    }

    .edge-fade--right {
      right: 0;
      background: linear-gradient(270deg, var(--bg) 25%, transparent);
    }

    #timeline-scroller {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      height: 200px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #timeline-scroller::-webkit-scrollbar {
      height: 6px;
    }

    #timeline-scroller::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #timeline {
      display: block;
      height: 200px;
    }

    .axis path,
    .axis line {
      stroke: var(--border);
    }

    .axis text {
      fill: var(--muted);
      font-size: 11px;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .timeline-line {
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .event-link {
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      scroll-snap-align: center;
    }

    .event-link:focus-visible .event-marker {
      stroke: var(--text);
      stroke-width: 2px;
    }

    .event-marker {
      stroke: var(--bg);
      stroke-width: 2px;
      transition: r 0.15s, fill 0.15s;
    }

    .event-link:hover .event-marker,
    .event-link.selected .event-marker {
      stroke-width: 2.5px;
    }

    .event-link.lts .event-marker {
      fill: var(--lts);
    }

    .event-link.release .event-marker {
      fill: #3b82f6;
    }

    .event-link:hover .event-marker,
    .event-link.selected .event-marker {
      filter: brightness(1.15);
    }

    .event-label {
      font-size: 11px;
      fill: var(--text);
      pointer-events: none;
    }

    .event-label--above {
      dominant-baseline: text-bottom;
    }

    .event-label .version {
      font-weight: 600;
      font-size: 12px;
    }

    .event-label .date {
      fill: var(--muted);
      font-size: 10px;
    }

    .event-label.lts .version {
      fill: var(--lts);
    }

    .lts-badge {
      font-size: 8px;
      font-weight: 700;
      fill: var(--bg);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      dominant-baseline: central;
    }

    .connector {
      stroke: var(--border);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }

    #detail {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detail-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: flex-start;
      gap: 0.35rem 1rem;
    }

    #detail h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    #detail h2 .lts-tag {
      display: inline-block;
      margin-left: 0.5rem;
      padding: 0.12rem 0.45rem;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--lts);
      color: var(--bg);
      border-radius: 4px;
      vertical-align: middle;
    }

    #detail .meta {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: left;
      flex-shrink: 0;
    }

    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 0.85rem 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .site-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .site-footer a:hover {
      text-decoration: underline;
    }

    .site-footer p {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0;
    }

    .site-footer__github {
      display: inline-flex;
      align-items: center;
      line-height: 0;
    }

    .site-footer__github:hover {
      text-decoration: none;
    }

    .site-footer__github svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
    }

    .btn-graph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1rem;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      width: 100%;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-graph:not(:disabled):hover {
      filter: brightness(1.08);
    }

    .btn-graph:not(:disabled):active {
      transform: scale(0.98);
    }

    .btn-graph:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--border);
      color: var(--muted);
    }

    .detail-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }

    .detail-actions .btn-graph {
      width: 100%;
    }

    @media (min-width: 640px) {
      header {
        padding: 1.25rem 1.5rem 0.75rem;
      }

      .header-title-row h1 {
        font-size: 1.65rem;
      }

      .header-title-row .btn-graph {
        padding: 0.65rem 1rem;
        font-size: 0.9rem;
      }

      .header-separator {
        margin-left: -1.5rem;
        margin-right: -1.5rem;
      }

      header p {
        font-size: 0.9rem;
        max-width: 52rem;
      }

      .legend-bar {
        padding: 0.65rem 1.5rem;
        font-size: 0.8rem;
      }

      #timeline-scroller {
        height: 260px;
      }

      #timeline {
        height: 260px;
      }

      #detail {
        padding: 1rem 1.5rem 1.25rem;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
      }

      .detail-actions {
        flex-direction: row;
        flex-wrap: nowrap;
        width: auto;
      }

      .detail-actions .btn-graph {
        width: auto;
        white-space: nowrap;
      }
    }

    @media (min-width: 900px) {
      #timeline-scroller {
        height: 300px;
      }

      #timeline {
        height: 300px;
      }
    }

  </style>
  <link rel="icon" type="image/png" href="images/java-icon.png">
</head>
<body>
  <header>
    <div class="header-title-row">
      <h1><span>JVM</span> Flags</h1>
      <a class="btn-graph" href="quiz-game.html">Quiz Game</a>
    </div>
    <div class="header-separator" aria-hidden="true"></div>
    <p>
      Learn and explore the JVM flags for each Java version running on a HotSpot JVM.
    </p>
    <section class="header-section" aria-labelledby="timeline-heading">
      <h2 id="timeline-heading">Timeline</h2>
      <p>
        Navigate in the timeline to explore the different JVM releases.
      </p>
    </section>
  </header>

  <div class="legend-bar" aria-hidden="true">
    <span><i class="dot release"></i> Major release</span>
    <span><i class="dot lts"></i> LTS (8, 11, 17, 21, 25)</span>
    <span>Tap a milestone</span>
  </div>

  <main>
    <div class="timeline-viewport">
      <span class="edge-fade edge-fade--left" aria-hidden="true"></span>
      <div id="timeline-scroller" tabindex="0" aria-label="Java release timeline — scroll horizontally">
        <svg id="timeline" role="img" aria-label="Java release timeline from 1996 to 2026"></svg>
      </div>
      <span class="edge-fade edge-fade--right" aria-hidden="true"></span>
    </div>
    <section id="detail" aria-live="polite"></section>
    <footer class="site-footer">
      <p>
        Built with ❤️ from
        <a
          href="https://www.google.com/maps/place/Community+of+Madrid,+Madrid/@40.4983324,-6.3162283,8z/data=!3m1!4b1!4m6!3m5!1s0xd41817a40e033b9:0x10340f3be4bc880!8m2!3d40.4167088!4d-3.5812692!16zL20vMGo0eGc?entry=ttu&amp;g_ep=EgoyMDI1MDgxOC4wIKXMDSoASAFQAw%3D%3D"
          target="_blank"
          rel="noopener noreferrer"
        >Madrid</a>
        <a
          class="site-footer__github"
          href="https://github.com/jabrena/jvm-flags"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View source on GitHub"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </p>
    </footer>
  </main>

  <script>
    const GRAPH_URL = "java-version.html";
    const EVOLUTION_URL = "jvm-flag-evolution.html";

    const events = [
      { version: 1, label: "Java 1.0", date: "1996-01-23" },
      { version: 1, label: "Java 1.1", date: "1997-02-19" },
      { version: 2, label: "Java 1.2", date: "1998-12-08" },
      { version: 3, label: "Java 1.3", date: "2000-05-08" },
      { version: 4, label: "Java 1.4", date: "2002-02-06" },
      { version: 5, label: "Java 5", date: "2004-09-30" },
      { version: 6, label: "Java 6", date: "2006-12-11" },
      { version: 7, label: "Java 7", date: "2011-07-28" },
      { version: 8, label: "Java 8", date: "2014-03-18", lts: true },
      { version: 9, label: "Java 9", date: "2017-09-21" },
      { version: 10, label: "Java 10", date: "2018-03-20" },
      { version: 11, label: "Java 11", date: "2018-09-25", lts: true },
      { version: 12, label: "Java 12", date: "2019-03-19" },
      { version: 13, label: "Java 13", date: "2019-09-17" },
      { version: 14, label: "Java 14", date: "2020-03-17" },
      { version: 15, label: "Java 15", date: "2020-09-15" },
      { version: 16, label: "Java 16", date: "2021-03-16" },
      { version: 17, label: "Java 17", date: "2021-09-14", lts: true },
      { version: 18, label: "Java 18", date: "2022-03-22" },
      { version: 19, label: "Java 19", date: "2022-09-20" },
      { version: 20, label: "Java 20", date: "2023-03-21" },
      { version: 21, label: "Java 21", date: "2023-09-19", lts: true },
      { version: 22, label: "Java 22", date: "2024-03-19" },
      { version: 23, label: "Java 23", date: "2024-09-17" },
      { version: 24, label: "Java 24", date: "2025-03-18" },
      { version: 25, label: "Java 25", date: "2025-09-16", lts: true },
      { version: 26, label: "Java 26", date: "2026-03-17" }
    ];

    events.forEach((e) => {
      e.parsed = d3.timeParse("%Y-%m-%d")(e.date);
    });

    const LTS_VERSIONS = new Set([8, 11, 17, 21, 25]);

    function graphHref(version) {
      return `${GRAPH_URL}?java=${version}`;
    }

    function evolutionHref(version) {
      return `${EVOLUTION_URL}?java=${version}`;
    }

    function formatDate(d) {
      return d3.timeFormat("%B %d, %Y")(d);
    }

    function formatYear(d) {
      return d3.timeFormat("%Y")(d);
    }

    const detailEl = document.getElementById("detail");
    const scroller = document.getElementById("timeline-scroller");
    const svg = d3.select("#timeline");
    let selected = events.find((e) => e.label === "Java 25") || events.find((e) => e.lts) || events[0];
    const margin = { top: 44, right: 48, bottom: 44, left: 48 };
    const MIN_EVENT_GAP = 88;
    const MIN_CHART_WIDTH = 2400;

    function renderDetail(ev) {
      const lts = ev.lts || LTS_VERSIONS.has(ev.version);
      const hasGraph = LTS_VERSIONS.has(ev.version);
      const exploreBtn = hasGraph
        ? `<a class="btn-graph" href="${graphHref(ev.version)}">Explore JVM flags →</a>`
        : `<button type="button" class="btn-graph" disabled>Explore JVM flags →</button>`;
      const evolutionBtn = hasGraph
        ? `<a class="btn-graph" href="${evolutionHref(ev.version)}">Visualize evolution →</a>`
        : `<button type="button" class="btn-graph" disabled>Visualize evolution →</button>`;
      detailEl.innerHTML = `
        <div>
          <div class="detail-header">
            <h2>${ev.label}${lts ? '<span class="lts-tag">LTS</span>' : ""}</h2>
            <p class="meta">${formatDate(ev.parsed)}</p>
          </div>
        </div>
        <div class="detail-actions">
          ${exploreBtn}
          ${evolutionBtn}
        </div>
      `;
    }

    function chartWidthForViewport(viewportW) {
      const byEvents = events.length * MIN_EVENT_GAP + margin.left + margin.right;
      return Math.max(viewportW, MIN_CHART_WIDTH, byEvents);
    }

    function scrollToEvent(ev, smooth = true) {
      if (ev.cx == null) return;
      const target = ev.cx + margin.left - scroller.clientWidth / 2;
      const max = scroller.scrollWidth - scroller.clientWidth;
      scroller.scrollTo({
        left: Math.max(0, Math.min(target, max)),
        behavior: smooth ? "smooth" : "auto"
      });
    }

    function draw() {
      const viewportW = scroller.clientWidth || window.innerWidth;
      const chartHeight = scroller.clientHeight;
      const chartWidth = chartWidthForViewport(viewportW);
      const innerW = chartWidth - margin.left - margin.right;
      const innerH = chartHeight - margin.top - margin.bottom;

      svg.selectAll("*").remove();
      svg
        .attr("width", chartWidth)
        .attr("height", chartHeight)
        .attr("viewBox", `0 0 ${chartWidth} ${chartHeight}`);

      const g = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const x = d3
        .scaleTime()
        .domain([new Date(1995, 6, 1), new Date(2026, 8, 1)])
        .range([0, innerW]);

      const axisY = innerH - 8;
      const isNarrow = viewportW < 640;
      const rRelease = isNarrow ? 8 : 6;
      const rLts = isNarrow ? 11 : 9;

      g.append("line")
        .attr("class", "timeline-line")
        .attr("x1", 0)
        .attr("y1", axisY)
        .attr("x2", innerW)
        .attr("y2", axisY);

      const xAxis = d3
        .axisBottom(x)
        .ticks(d3.timeYear.every(2))
        .tickFormat(d3.timeFormat("%Y"));

      g.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${axisY + 6})`)
        .call(xAxis);

      g.append("text")
        .attr("class", "axis-label")
        .attr("x", innerW / 2)
        .attr("y", axisY + 36)
        .attr("text-anchor", "middle")
        .text("Year");

      const laneTop = 24;
      const laneBottom = axisY - 24;

      events.forEach((ev) => {
        ev.lts = ev.lts || LTS_VERSIONS.has(ev.version);
      });

      function markerRadius(d) {
        return d.lts ? rLts : rRelease;
      }

      function markerCy(d) {
        const down = d.above ? (d.lts ? 6 : 18) : d.lts ? 2 : 18;
        return d.cy + down;
      }

      const LABEL_GAP = 12;

      events.forEach((ev, i) => {
        ev.above = i % 2 === 0;
        ev.cx = x(ev.parsed);
        ev.cy = ev.above ? laneTop + 36 : laneBottom - 36;
      });

      const links = g
        .selectAll(".event-link")
        .data(events)
        .join("a")
        .attr("class", (d) =>
          `event-link ${d.lts ? "lts" : "release"}${d === selected ? " selected" : ""}`
        )
        .attr("href", (d) => graphHref(d.version))
        .attr("xlink:href", (d) => graphHref(d.version))
        .attr("role", "button")
        .attr("aria-label", (d) => `${d.label}, ${formatDate(d.parsed)}`)
        .on("click", function (event, d) {
          event.preventDefault();
          selected = d;
          links.classed("selected", (n) => n === selected);
          renderDetail(d);
          scrollToEvent(d);
        })
        .on("keydown", function (event, d) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            this.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          }
        });

      links
        .append("line")
        .attr("class", "connector")
        .attr("x1", (d) => d.cx)
        .attr("y1", (d) => markerCy(d))
        .attr("x2", (d) => d.cx)
        .attr("y2", axisY);

      links
        .append("circle")
        .attr("class", "event-marker")
        .attr("cx", (d) => d.cx)
        .attr("cy", (d) => markerCy(d))
        .attr("r", markerRadius);

      links
        .filter((d) => d.lts)
        .append("text")
        .attr("class", "lts-badge")
        .attr("x", (d) => d.cx)
        .attr("y", (d) => markerCy(d))
        .attr("text-anchor", "middle")
        .text("LTS");

      const labels = links
        .append("text")
        .attr("class", (d) =>
          `event-label${d.lts ? " lts" : ""}${d.above ? " event-label--above" : ""}`
        )
        .attr("text-anchor", "middle");

      labels.each(function (d) {
        const el = d3.select(this);
        const r = markerRadius(d);
        const mc = markerCy(d);
        el.attr("x", d.cx);

        if (d.above) {
          const dateY = mc - r - LABEL_GAP;
          el.attr("y", dateY);
          el.append("tspan")
            .attr("class", "date")
            .attr("x", d.cx)
            .attr("dy", 0)
            .text(formatYear(d.parsed));
          el.append("tspan")
            .attr("class", "version")
            .attr("x", d.cx)
            .attr("dy", "-1.2em")
            .text(d.label);
        } else {
          const versionY = mc + r + LABEL_GAP;
          el.attr("y", versionY);
          el.append("tspan")
            .attr("class", "version")
            .attr("x", d.cx)
            .attr("dy", 0)
            .text(d.label);
          el.append("tspan")
            .attr("class", "date")
            .attr("x", d.cx)
            .attr("dy", "1.2em")
            .text(formatYear(d.parsed));
        }
      });

      renderDetail(selected);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      requestAnimationFrame(() => scrollToEvent(selected, !reduceMotion));
    }

    draw();
    window.addEventListener("resize", d3.debounce(draw, 150));
  </script>
