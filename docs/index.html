          <div class="nav-menu-panel" id="nav-menu-panel" role="menu" hidden>

  <div class="legend-bar" aria-hidden="true">

  <main>
    <div class="timeline-viewport">
      <span class="edge-fade edge-fade--left" aria-hidden="true"></span>
      <div id="timeline-scroller" tabindex="0" aria-label="Java release timeline — scroll horizontally">
        <svg id="timeline" role="img" aria-label="Java release timeline from 1996 to 2026"></svg>
      </div>

    </div>

  <script>
    const GRAPH_URL = "java-version.html";
    const EVOLUTION_URL = "jvm-flag-evolution.html";

    const events = [
      { version: 1, label: "Java 1.0", date: "1996-01-23" },
      { version: 1, label: "Java 1.1", date: "1997-02-19" },
      { version: 2, label: "Java 1.2", date: "1998-12-08" },
      { version: 3, label: "Java 1.3", date: "2000-05-08" },
      { version: 4, label: "Java 1.4", date: "2002-02-06" },
      { version: 5, label: "Java 5", date: "2004-09-30" },
      { version: 6, label: "Java 6", date: "2006-12-11" },
      { version: 7, label: "Java 7", date: "2011-07-28" },
      { version: 8, label: "Java 8", date: "2014-03-18", lts: true },
      { version: 9, label: "Java 9", date: "2017-09-21" },
      { version: 10, label: "Java 10", date: "2018-03-20" },
      { version: 11, label: "Java 11", date: "2018-09-25", lts: true },
      { version: 12, label: "Java 12", date: "2019-03-19" },
      { version: 13, label: "Java 13", date: "2019-09-17" },
      { version: 14, label: "Java 14", date: "2020-03-17" },
      { version: 15, label: "Java 15", date: "2020-09-15" },
      { version: 16, label: "Java 16", date: "2021-03-16" },
      { version: 17, label: "Java 17", date: "2021-09-14", lts: true },
      { version: 18, label: "Java 18", date: "2022-03-22" },
      { version: 19, label: "Java 19", date: "2022-09-20" },
      { version: 20, label: "Java 20", date: "2023-03-21" },
      { version: 21, label: "Java 21", date: "2023-09-19", lts: true },
      { version: 22, label: "Java 22", date: "2024-03-19" },
      { version: 23, label: "Java 23", date: "2024-09-17" },
      { version: 24, label: "Java 24", date: "2025-03-18" },
      { version: 25, label: "Java 25", date: "2025-09-16", lts: true },
      { version: 26, label: "Java 26", date: "2026-03-17" }
    ];

    events.forEach((e) => {
      e.parsed = d3.timeParse("%Y-%m-%d")(e.date);
    });

    const LTS_VERSIONS = new Set([8, 11, 17, 21, 25]);

    function graphHref(version) {
      return `${GRAPH_URL}?java=${version}`;
    }

    function evolutionHref(version) {
      return `${EVOLUTION_URL}?java=${version}`;
    }

    function formatDate(d) {
      return d3.timeFormat("%B %d, %Y")(d);
    }

    function formatYear(d) {
      return d3.timeFormat("%Y")(d);
    }

    const detailEl = document.getElementById("detail");
    const scroller = document.getElementById("timeline-scroller");
    const svg = d3.select("#timeline");
    let selected = events.find((e) => e.label === "Java 25") || events.find((e) => e.lts) || events[0];
    const margin = { top: 44, right: 48, bottom: 44, left: 48 };
    const MIN_EVENT_GAP = 88;
    const MIN_CHART_WIDTH = 2400;

    function renderDetail(ev) {
      const lts = ev.lts || LTS_VERSIONS.has(ev.version);
      const hasGraph = LTS_VERSIONS.has(ev.version);
      const exploreBtn = hasGraph
        ? `<a class="btn-graph" href="${graphHref(ev.version)}">Explore JVM flags →</a>`
        : `<button type="button" class="btn-graph" disabled>Explore JVM flags →</button>`;
      const evolutionBtn = hasGraph
        ? `<a class="btn-graph" href="${evolutionHref(ev.version)}">Visualize evolution →</a>`
        : `<button type="button" class="btn-graph" disabled>Visualize evolution →</button>`;
      detailEl.innerHTML = `
        <div>
          <div class="detail-header">
            <h2>${ev.label}${lts ? '<span class="lts-tag">LTS</span>' : ""}</h2>
            <p class="meta">${formatDate(ev.parsed)}</p>
          </div>
        </div>
        <div class="detail-actions">
          ${exploreBtn}
          ${evolutionBtn}
        </div>
      `;
    }

    function chartWidthForViewport(viewportW) {
      const byEvents = events.length * MIN_EVENT_GAP + margin.left + margin.right;
      return Math.max(viewportW, MIN_CHART_WIDTH, byEvents);
    }

    function scrollToEvent(ev, smooth = true) {
      if (ev.cx == null) return;
      const target = ev.cx + margin.left - scroller.clientWidth / 2;
      const max = scroller.scrollWidth - scroller.clientWidth;
      scroller.scrollTo({
        left: Math.max(0, Math.min(target, max)),
        behavior: smooth ? "smooth" : "auto"
      });
    }

    function draw() {
      const viewportW = scroller.clientWidth || window.innerWidth;
      const chartHeight = scroller.clientHeight;
      const chartWidth = chartWidthForViewport(viewportW);
      const innerW = chartWidth - margin.left - margin.right;
      const innerH = chartHeight - margin.top - margin.bottom;

      svg.selectAll("*").remove();
      svg
        .attr("width", chartWidth)
        .attr("height", chartHeight)
        .attr("viewBox", `0 0 ${chartWidth} ${chartHeight}`);

      const g = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const x = d3
        .scaleTime()
        .domain([new Date(1995, 6, 1), new Date(2026, 8, 1)])
        .range([0, innerW]);

      const axisY = innerH - 8;
      const isNarrow = viewportW < 640;
      const rRelease = isNarrow ? 8 : 6;
      const rLts = isNarrow ? 11 : 9;

      g.append("line")
        .attr("class", "timeline-line")
        .attr("x1", 0)
        .attr("y1", axisY)
        .attr("x2", innerW)
        .attr("y2", axisY);

      const xAxis = d3
        .axisBottom(x)
        .ticks(d3.timeYear.every(2))
        .tickFormat(d3.timeFormat("%Y"));

      g.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${axisY + 6})`)
        .call(xAxis);

      g.append("text")
        .attr("class", "axis-label")
        .attr("x", innerW / 2)
        .attr("y", axisY + 36)
        .attr("text-anchor", "middle")
        .text("Year");

      const laneTop = 24;
      const laneBottom = axisY - 24;

      events.forEach((ev) => {
        ev.lts = ev.lts || LTS_VERSIONS.has(ev.version);
      });

      function markerRadius(d) {
        return d.lts ? rLts : rRelease;
      }

      function markerCy(d) {
        const down = d.above ? (d.lts ? 6 : 18) : d.lts ? 2 : 18;
        return d.cy + down;
      }

      const LABEL_GAP = 12;

      events.forEach((ev, i) => {
        ev.above = i % 2 === 0;
        ev.cx = x(ev.parsed);
        ev.cy = ev.above ? laneTop + 36 : laneBottom - 36;
      });

      const links = g
        .selectAll(".event-link")
        .data(events)
        .join("a")
        .attr("class", (d) =>
          `event-link ${d.lts ? "lts" : "release"}${d === selected ? " selected" : ""}`
        )
        .attr("href", (d) => graphHref(d.version))
        .attr("xlink:href", (d) => graphHref(d.version))
        .attr("role", "button")
        .attr("aria-label", (d) => `${d.label}, ${formatDate(d.parsed)}`)
        .on("click", function (event, d) {
          event.preventDefault();
          selected = d;
          links.classed("selected", (n) => n === selected);
          renderDetail(d);
          scrollToEvent(d);
        })
        .on("keydown", function (event, d) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            this.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          }
        });

      links
        .append("line")
        .attr("class", "connector")
        .attr("x1", (d) => d.cx)
        .attr("y1", (d) => markerCy(d))
        .attr("x2", (d) => d.cx)
        .attr("y2", axisY);

      links
        .append("circle")
        .attr("class", "event-marker")
        .attr("cx", (d) => d.cx)
        .attr("cy", (d) => markerCy(d))
        .attr("r", markerRadius);

      links
        .filter((d) => d.lts)
        .append("text")
        .attr("class", "lts-badge")
        .attr("x", (d) => d.cx)
        .attr("y", (d) => markerCy(d))
        .attr("text-anchor", "middle")
        .text("LTS");

      const labels = links
        .append("text")
        .attr("class", (d) =>
          `event-label${d.lts ? " lts" : ""}${d.above ? " event-label--above" : ""}`
        )
        .attr("text-anchor", "middle");

      labels.each(function (d) {
        const el = d3.select(this);
        const r = markerRadius(d);
        const mc = markerCy(d);
        el.attr("x", d.cx);

        if (d.above) {
          const dateY = mc - r - LABEL_GAP;
          el.attr("y", dateY);
          el.append("tspan")
            .attr("class", "date")
            .attr("x", d.cx)
            .attr("dy", 0)
            .text(formatYear(d.parsed));
          el.append("tspan")
            .attr("class", "version")
            .attr("x", d.cx)
            .attr("dy", "-1.2em")
            .text(d.label);
        } else {
          const versionY = mc + r + LABEL_GAP;
          el.attr("y", versionY);
          el.append("tspan")
            .attr("class", "version")
            .attr("x", d.cx)
            .attr("dy", 0)
            .text(d.label);
          el.append("tspan")
            .attr("class", "date")
            .attr("x", d.cx)
            .attr("dy", "1.2em")
            .text(formatYear(d.parsed));
        }
      });

      renderDetail(selected);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      requestAnimationFrame(() => scrollToEvent(selected, !reduceMotion));
    }

    draw();
    window.addEventListener("resize", d3.debounce(draw, 150));
  </script>
  <script>
    (function () {
      const toggle = document.getElementById("nav-menu-toggle");
      const panel = document.getElementById("nav-menu-panel");
      if (!toggle || !panel) return;

      function setOpen(open) {
        toggle.setAttribute("aria-expanded", String(open));
        panel.hidden = !open;
      }

      function close() {
        setOpen(false);
      }

      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        setOpen(toggle.getAttribute("aria-expanded") !== "true");
      });

      panel.addEventListener("click", (e) => {
        if (e.target.closest("a")) close();
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".nav-menu")) close();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") close();
      });
    })();
  </script>
