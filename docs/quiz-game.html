<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game — JVM Flags</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #f59e0b;
      --lts: #fbbf24;
      --success: #34d399;
      --error: #f87171;
      --flag: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header .top-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .back-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--bg);
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    header p {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.45;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 2rem;
      overflow: visible;
    }

    .panel {
      width: 100%;
      max-width: 36rem;
    }

    .panel:has(.has-review) {
      max-width: 56rem;
    }

    .progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .progress-bar .score {
      color: var(--muted);
    }

    .progress-bar .counter {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .question-type {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .question-prompt {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .flag-display {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--flag);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 1rem;
      word-break: break-all;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .answer-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      font: inherit;
      font-size: 0.9rem;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.08);
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-btn.correct {
      border-color: var(--success);
      background: rgba(52, 211, 153, 0.12);
    }

    .answer-btn.wrong {
      border-color: var(--error);
      background: rgba(248, 113, 113, 0.1);
    }

    .answer-btn.reveal-correct {
      border-color: var(--success);
    }

    .review-section {
      margin-top: 1rem;
      text-align: left;
    }

    .review-section h3 {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--text);
    }

    .review-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      margin: 0 0 1rem;
      padding: 0;
      list-style: none;
    }

    .review-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--error);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
      text-align: left;
    }

    .review-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.2rem;
    }

    .review-item .review-q {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--bg);
      background: var(--muted);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    .review-item .review-type {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .review-item .review-flag {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--flag);
      margin-bottom: 0.2rem;
      word-break: break-all;
      line-height: 1.3;
    }

    .review-item .review-prompt {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      line-height: 1.3;
    }

    .review-item .review-answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 0.5rem;
      font-size: 0.72rem;
      line-height: 1.35;
    }

    .review-item .review-answers .label {
      display: block;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.1rem;
      opacity: 0.85;
    }

    .review-item .your-answer {
      color: var(--error);
    }

    .review-item .correct-answer {
      color: var(--success);
    }

    .result-card.has-review {
      text-align: left;
      padding: 1rem 1rem 1.1rem;
    }

    .result-card.has-review .result-header {
      text-align: center;
      margin-bottom: 0.35rem;
    }

    .result-card.has-review .result-icon {
      font-size: 2rem;
      margin-bottom: 0.35rem;
    }

    .result-card.has-review .result-title {
      font-size: 1.15rem;
    }

    .result-card.has-review .result-score {
      font-size: 0.9rem;
      margin-bottom: 0;
    }

    @media (min-width: 640px) {
      .review-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .panel:has(.has-review) {
        max-width: 52rem;
      }
    }

    @media (min-width: 900px) {
      .review-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .btn-graph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1rem;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-graph:hover {
      filter: brightness(1.08);
    }

    .btn-graph:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      filter: none;
      border-color: var(--accent);
    }

    .result-card {
      text-align: center;
      padding: 2rem 1.25rem;
    }

    .result-icon {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .result-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .result-title.win { color: var(--success); }
    .result-title.lose { color: var(--error); }

    .result-score {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }

    .loading.error {
      color: var(--error);
    }

    @media (min-width: 640px) {
      header {
        padding: 1.25rem 1.5rem 0.75rem;
      }

      header h1 {
        font-size: 1.35rem;
      }

      main {
        padding: 1.5rem;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="images/java-icon.png">
</head>
<body>
  <header>
    <div class="top-row">
      <a class="back-link" href="index.html">← Back</a>
      <h1><span>Quiz</span> Game</h1>
    </div>
    <p>20 random questions about JVM flags from LTS releases (8, 11, 17, 21, 25). Score 70% or better (14/20) to pass the quiz.</p>
  </header>

  <main>
    <div class="panel" id="app">
      <p class="loading">Loading flag data…</p>
    </div>
  </main>

  <script>
    const LTS_VERSIONS = [8, 11, 17, 21, 25];
    const TOTAL_QUESTIONS = 20;
    const PASS_PERCENT = 70;
    const WIN_THRESHOLD = Math.ceil((TOTAL_QUESTIONS * PASS_PERCENT) / 100);

    const TYPE_LABELS = {
      versionPresence: "Version check",
      whichVersion: "LTS release",
      description: "Flag description",
      flagCount: "Catalog size"
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function parseGraph(data, version) {
      const nodesById = new Map(data.nodes.map((n) => [n.id, n]));
      const parentOfFlag = new Map();

      for (const link of data.edges) {
        const target = nodesById.get(link.target);
        if (target?.type === "flag") {
          parentOfFlag.set(link.target, link.source);
        }
      }

      const flags = [];
      const parentGroups = new Map();

      for (const node of data.nodes) {
        if (node.type !== "flag" || !node.description) continue;

        const entry = {
          version,
          id: node.id,
          flag: node.flag,
          description: node.description,
          flagId: node.flagId
        };
        flags.push(entry);

        const parentId = parentOfFlag.get(node.id) || "_ungrouped";
        if (!parentGroups.has(parentId)) parentGroups.set(parentId, []);
        parentGroups.get(parentId).push(entry);
      }

      return { flags, parentGroups };
    }

    function buildFlagIndex(versionData) {
      const byVersion = new Map();
      const byFlagId = new Map();
      const versionsForFlagId = new Map();
      const parentGroupsByVersion = new Map();
      const allFlags = [];

      for (const { version, data } of versionData) {
        const { flags, parentGroups } = parseGraph(data, version);
        byVersion.set(version, flags);
        parentGroupsByVersion.set(version, parentGroups);
        allFlags.push(...flags);

        for (const f of flags) {
          if (!versionsForFlagId.has(f.flagId)) {
            versionsForFlagId.set(f.flagId, new Set());
          }
          versionsForFlagId.get(f.flagId).add(version);
          if (!byFlagId.has(f.flagId)) {
            byFlagId.set(f.flagId, f);
          }
        }
      }

      return {
        byVersion,
        byFlagId,
        versionsForFlagId,
        parentGroupsByVersion,
        allFlags
      };
    }

    function buildVersionPresenceQuestion(index) {
      const version = pickRandom(LTS_VERSIONS);
      const present = Math.random() < 0.5;
      let flag;
      let answerYes;

      if (present) {
        const inVersion = index.byVersion.get(version);
        if (!inVersion?.length) return null;
        flag = pickRandom(inVersion);
        answerYes = true;
      } else {
        const absent = index.allFlags.filter(
          (f) => !index.versionsForFlagId.get(f.flagId)?.has(version)
        );
        if (!absent.length) return null;
        flag = pickRandom(absent);
        answerYes = false;
      }

      const options = shuffle(["Yes", "No"]);
      return {
        type: "versionPresence",
        flagId: flag.flagId,
        scopeVersion: version,
        prompt: `Is this flag available in <strong>Java ${version}</strong>?`,
        flag: flag.flag,
        options,
        correctIndex: options.indexOf(answerYes ? "Yes" : "No")
      };
    }

    function parseJavaVersionOption(option) {
      const match = /^Java (\d+)$/.exec(option);
      return match ? Number(match[1]) : null;
    }

    function isWhichVersionCorrect(q, selectedIndex) {
      const version = parseJavaVersionOption(q.options[selectedIndex]);
      return version != null && q.correctVersions.includes(version);
    }

    function formatWhichVersionCorrectAnswer(correctVersions) {
      const labels = correctVersions.map((v) => `Java ${v}`);
      return labels.length === 1 ? labels[0] : `Any of: ${labels.join(", ")}`;
    }

    function buildWhichVersionQuestion(index) {
      const entries = [...index.versionsForFlagId.entries()].filter(([, vers]) => {
        const lts = [...vers].filter((v) => LTS_VERSIONS.includes(v));
        return lts.length > 0 && lts.length < LTS_VERSIONS.length;
      });
      if (!entries.length) return null;

      const [flagId, versions] = pickRandom(entries);
      const flag = index.byFlagId.get(flagId);
      const ltsPresent = [...versions].filter((v) => LTS_VERSIONS.includes(v));
      const ltsAbsent = LTS_VERSIONS.filter((v) => !versions.has(v));

      const wrongVersions = shuffle(ltsAbsent).slice(0, 3);
      const presentCount = Math.min(ltsPresent.length, 4 - wrongVersions.length);
      const presentVersions = shuffle(ltsPresent).slice(0, presentCount);
      const options = shuffle([
        ...presentVersions.map((v) => `Java ${v}`),
        ...wrongVersions.map((v) => `Java ${v}`)
      ]);

      if (options.length < 2) return null;

      return {
        type: "whichVersion",
        flagId,
        correctVersions: ltsPresent,
        prompt: "Name <strong>one</strong> LTS release that includes this flag.",
        flag: flag.flag,
        options
      };
    }

    function buildDescriptionQuestion(index) {
      const version = pickRandom(LTS_VERSIONS);
      const groups = index.parentGroupsByVersion.get(version);
      const eligible = [...groups.values()].filter((g) => {
        if (g.length < 4) return false;
        return new Set(g.map((f) => f.description)).size >= 4;
      });
      if (!eligible.length) return null;

      const siblings = pickRandom(eligible);
      const correct = pickRandom(siblings);
      const distractors = shuffle(siblings.filter((f) => f !== correct)).slice(0, 3);

      const optionTexts = [
        correct.description,
        ...distractors.map((f) => f.description)
      ];
      if (new Set(optionTexts).size < 4) return null;

      const options = shuffle([
        { text: correct.description, correct: true },
        ...distractors.map((f) => ({ text: f.description, correct: false }))
      ]);

      return {
        type: "description",
        flagId: correct.flagId,
        scopeVersion: version,
        prompt: "Which description matches this JVM flag?",
        flag: correct.flag,
        options: options.map((o) => o.text),
        correctIndex: options.findIndex((o) => o.correct)
      };
    }

    function buildFlagCountQuestion(index) {
      const version = pickRandom(LTS_VERSIONS);
      const flags = index.byVersion.get(version);
      if (!flags?.length) return null;

      const correctCount = flags.length;
      const distractorCounts = LTS_VERSIONS.filter((v) => v !== version)
        .map((v) => index.byVersion.get(v)?.length)
        .filter((c) => c != null && c !== correctCount);
      const distractors = shuffle(distractorCounts).slice(0, 3);
      if (distractors.length < 3) return null;

      const options = shuffle([
        String(correctCount),
        ...distractors.map(String)
      ]);

      return {
        type: "flagCount",
        flagId: "_catalog",
        scopeVersion: version,
        prompt: `How many JVM flags are cataloged for <strong>Java ${version}</strong> on this site?`,
        flag: "",
        options,
        correctIndex: options.indexOf(String(correctCount))
      };
    }

    function questionDedupKey(q) {
      const scope = q.scopeVersion != null ? String(q.scopeVersion) : "";
      return `${q.type}|${q.flagId}|${scope}`;
    }

    function generateQuiz(index) {
      const generators = [
        () => buildVersionPresenceQuestion(index),
        () => buildWhichVersionQuestion(index),
        () => buildDescriptionQuestion(index),
        () => buildFlagCountQuestion(index)
      ];

      const questions = [];
      const usedKeys = new Set();
      let attempts = 0;
      while (questions.length < TOTAL_QUESTIONS && attempts < 300) {
        attempts++;
        const q = pickRandom(generators)();
        if (!q) continue;
        const key = questionDedupKey(q);
        if (usedKeys.has(key)) continue;
        usedKeys.add(key);
        questions.push(q);
      }
      return questions;
    }

    let activeQuiz = null;

    function bindQuizHost(appEl) {
      if (appEl.dataset.quizBound) return;
      appEl.dataset.quizBound = "1";
      appEl.addEventListener("click", (e) => {
        const answerBtn = e.target.closest(".answer-btn");
        if (answerBtn && activeQuiz) {
          activeQuiz.onAnswerClick(answerBtn);
          return;
        }
        if (e.target.closest("#play-again") && activeQuiz) {
          new QuizGame(appEl, activeQuiz.index);
        }
      });
    }

    class QuizGame {
      constructor(appEl, index) {
        this.app = appEl;
        this.index = index;
        this.questions = generateQuiz(index);
        this.current = 0;
        this.score = 0;
        this.answered = false;
        this.results = [];
        bindQuizHost(appEl);
        activeQuiz = this;
        this.render();
      }

      onAnswerClick(btn) {
        if (this.answered || btn.disabled) return;
        const selectedIndex = parseInt(btn.getAttribute("data-index"), 10);
        if (Number.isNaN(selectedIndex)) return;
        this.handleAnswer(selectedIndex);
      }

      render() {
        if (this.questions.length < TOTAL_QUESTIONS) {
          this.app.innerHTML =
            '<p class="loading error">Could not generate enough questions. Try refreshing.</p>';
          return;
        }

        if (this.current >= TOTAL_QUESTIONS) {
          this.renderResult();
          return;
        }

        const q = this.questions[this.current];
        const pct = ((this.current) / TOTAL_QUESTIONS) * 100;

        this.app.innerHTML = `
          <div class="progress-bar">
            <span class="score">Correct: ${this.score}</span>
            <span class="counter">${this.current + 1} / ${TOTAL_QUESTIONS}</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" style="width: ${pct}%"></div>
          </div>
          <article class="question-card">
            <p class="question-type">${TYPE_LABELS[q.type]}</p>
            <p class="question-prompt">${q.prompt}</p>
            ${q.flag ? `<p class="flag-display">${escapeHtml(q.flag)}</p>` : ""}
            <div class="answers" role="group" aria-label="Answer choices">
              ${q.options
                .map(
                  (opt, i) =>
                    `<button type="button" class="answer-btn" data-index="${i}">${escapeHtml(opt)}</button>`
                )
                .join("")}
            </div>
          </article>
        `;
      }

      handleAnswer(selectedIndex) {
        if (this.answered) return;
        this.answered = true;

        const q = this.questions[this.current];
        const correct =
          q.type === "whichVersion"
            ? isWhichVersionCorrect(q, selectedIndex)
            : selectedIndex === q.correctIndex;
        if (correct) this.score++;

        const correctAnswer =
          q.type === "whichVersion"
            ? formatWhichVersionCorrectAnswer(q.correctVersions)
            : q.options[q.correctIndex];

        this.results.push({
          correct,
          questionNumber: this.current + 1,
          question: q,
          userAnswer: q.options[selectedIndex],
          correctAnswer
        });

        this.current++;
        this.answered = false;
        this.render();
      }

      renderReviewItems(failures) {
        return failures
          .map((r) => {
            const prompt = r.question.prompt.replace(/<\/?strong>/g, "");
            return `
          <li class="review-item">
            <div class="review-meta">
              <span class="review-q">Q${r.questionNumber}</span>
              <span class="review-type">${TYPE_LABELS[r.question.type]}</span>
            </div>
            ${r.question.flag ? `<p class="review-flag">${escapeHtml(r.question.flag)}</p>` : ""}
            <p class="review-prompt">${escapeHtml(prompt)}</p>
            <div class="review-answers">
              <p class="your-answer"><span class="label">Yours</span>${escapeHtml(r.userAnswer)}</p>
              <p class="correct-answer"><span class="label">Correct</span>${escapeHtml(r.correctAnswer)}</p>
            </div>
          </li>`;
          })
          .join("");
      }

      renderResult() {
        const won = this.score >= WIN_THRESHOLD;
        const failures = this.results.filter((r) => !r.correct);
        const hasReview = failures.length > 0;

        this.app.innerHTML = `
          <article class="question-card result-card${hasReview ? " has-review" : ""}">
            <div class="result-header">
              <p class="result-icon" aria-hidden="true">${won ? "🏆" : "📚"}</p>
              <h2 class="result-title ${won ? "win" : "lose"}">${won ? "You win!" : "Keep practicing"}</h2>
              <p class="result-score">You scored <strong>${this.score} / ${TOTAL_QUESTIONS}</strong>${won ? "" : ` — need ${WIN_THRESHOLD} to pass the quiz`}.</p>
            </div>
            ${
              hasReview
                ? `<section class="review-section" aria-label="Review incorrect answers">
                <h3>${failures.length === 1 ? "1 question to review" : `${failures.length} questions to review`}</h3>
                <ol class="review-list">${this.renderReviewItems(failures)}</ol>
              </section>`
                : `<p class="result-score" style="margin-bottom: 1.25rem;">Perfect run — every answer was correct.</p>`
            }
            <div class="result-actions">
              <button type="button" class="btn-graph" id="play-again">Play again</button>
              <a class="btn-graph btn-secondary" href="index.html">Back</a>
            </div>
          </article>
        `;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function init() {
      const app = document.getElementById("app");
      try {
        const versionData = await Promise.all(
          LTS_VERSIONS.map(async (version) => {
            const res = await fetch(`json/java-${version}.json`);
            if (!res.ok) throw new Error(`Failed to load Java ${version} data`);
            const data = await res.json();
            return { version, data };
          })
        );
        const index = buildFlagIndex(versionData);
        new QuizGame(app, index);
      } catch (err) {
        app.innerHTML = `<p class="loading error">${escapeHtml(err.message)}</p>`;
      }
    }

    init();
  </script>
</body>
</html>
