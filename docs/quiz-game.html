<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVM Flags - Quiz Game</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" type="image/png" href="images/java-icon.png">
</head>
<body class="page-quiz-game">
  <header>
    <div class="top-row">
      <a class="back-link" href="index.html">← Back</a>
      <h1><span>Quiz</span> Game</h1>
    </div>
    <p>20 random questions about JVM flags in Java 25. Score 70% or better (14/20) to pass the quiz.</p>
  </header>

  <main>
    <div class="panel" id="app">
      <p class="loading">Loading flag data…</p>
    </div>
  </main>

  <script>
    const LTS_VERSIONS = [8, 11, 17, 21, 25];
    const QUIZ_SCOPE_VERSION = 25;
    const TOTAL_QUESTIONS = 20;
    const PASS_PERCENT = 70;
    const WIN_THRESHOLD = Math.ceil((TOTAL_QUESTIONS * PASS_PERCENT) / 100);

    const TYPE_LABELS = {
      versionPresence: "Version check",
      description: "Flag description",
      flagFromDescription: "Flag name",
      flagCount: "Catalog size"
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function parseGraph(data, version) {
      const nodesById = new Map(data.nodes.map((n) => [n.id, n]));
      const parentOfFlag = new Map();

      for (const link of data.edges) {
        const target = nodesById.get(link.target);
        if (target?.type === "flag") {
          parentOfFlag.set(link.target, link.source);
        }
      }

      const flags = [];
      const parentGroups = new Map();

      for (const node of data.nodes) {
        if (node.type !== "flag" || !node.description) continue;

        const parentId = parentOfFlag.get(node.id) || "_ungrouped";
        const entry = {
          version,
          id: node.id,
          flag: node.flag,
          description: node.description,
          flagId: node.flagId
        };
        flags.push(entry);

        if (!parentGroups.has(parentId)) parentGroups.set(parentId, []);
        parentGroups.get(parentId).push(entry);
      }

      return { flags, parentGroups };
    }

    function buildFlagIndex(versionData) {
      const byVersion = new Map();
      const byFlagId = new Map();
      const versionsForFlagId = new Map();
      const parentGroupsByVersion = new Map();
      const allFlags = [];

      for (const { version, data } of versionData) {
        const { flags, parentGroups } = parseGraph(data, version);
        byVersion.set(version, flags);
        parentGroupsByVersion.set(version, parentGroups);
        allFlags.push(...flags);

        for (const f of flags) {
          if (!versionsForFlagId.has(f.flagId)) {
            versionsForFlagId.set(f.flagId, new Set());
          }
          versionsForFlagId.get(f.flagId).add(version);
          if (!byFlagId.has(f.flagId)) {
            byFlagId.set(f.flagId, f);
          }
        }
      }

      return {
        byVersion,
        byFlagId,
        versionsForFlagId,
        parentGroupsByVersion,
        allFlags
      };
    }

    function flagInVersion(index, flagId, version) {
      return index.versionsForFlagId.get(flagId)?.has(version) ?? false;
    }

    function pickFlagFromVersion(index, version) {
      const flags = index.byVersion.get(version);
      if (!flags?.length) return null;
      return pickRandom(flags);
    }

    function buildVersionPresenceQuestion(index) {
      const version = QUIZ_SCOPE_VERSION;
      const present = Math.random() < 0.5;
      let flag;
      let answerYes;

      if (present) {
        flag = pickFlagFromVersion(index, version);
        if (!flag) return null;
        answerYes = true;
      } else {
        const absent = index.allFlags.filter((f) => !flagInVersion(index, f.flagId, version));
        if (!absent.length) return null;
        flag = pickRandom(absent);
        answerYes = false;
      }

      const options = shuffle(["Yes", "No"]);
      return {
        type: "versionPresence",
        flagId: flag.flagId,
        scopeVersion: version,
        prompt: `Is this flag available in <strong>Java ${version}</strong>?`,
        flag: flag.flag,
        options,
        correctIndex: options.indexOf(answerYes ? "Yes" : "No")
      };
    }

    function buildDescriptionQuestion(index) {
      const version = QUIZ_SCOPE_VERSION;
      const siblings = pickEligibleSiblingGroup(index, version);
      if (!siblings) return null;
      const correct = pickRandom(siblings);
      const distractors = shuffle(siblings.filter((f) => f !== correct)).slice(0, 3);

      const optionTexts = [
        correct.description,
        ...distractors.map((f) => f.description)
      ];
      if (new Set(optionTexts).size < 4) return null;

      const options = shuffle([
        { text: correct.description, correct: true },
        ...distractors.map((f) => ({ text: f.description, correct: false }))
      ]);

      return {
        type: "description",
        flagId: correct.flagId,
        scopeVersion: version,
        prompt: "Which description matches this JVM flag?",
        flag: correct.flag,
        options: options.map((o) => o.text),
        correctIndex: options.findIndex((o) => o.correct)
      };
    }

    function pickEligibleSiblingGroup(index, version) {
      const groups = index.parentGroupsByVersion.get(version);
      const eligible = [...groups.values()].filter((g) => {
        if (g.length < 4) return false;
        return new Set(g.map((f) => f.description)).size >= 4;
      });
      if (!eligible.length) return null;
      return pickRandom(eligible);
    }

    function buildFlagFromDescriptionQuestion(index) {
      const version = QUIZ_SCOPE_VERSION;
      const siblings = pickEligibleSiblingGroup(index, version);
      if (!siblings) return null;

      const correct = pickRandom(siblings);
      const distractors = shuffle(siblings.filter((f) => f !== correct)).slice(0, 3);

      const optionTexts = [correct.flag, ...distractors.map((f) => f.flag)];
      if (new Set(optionTexts).size < 4) return null;

      const options = shuffle([
        { text: correct.flag, correct: true },
        ...distractors.map((f) => ({ text: f.flag, correct: false }))
      ]);

      return {
        type: "flagFromDescription",
        flagId: correct.flagId,
        scopeVersion: version,
        prompt: "Which JVM flag matches this description?",
        flag: correct.description,
        options: options.map((o) => o.text),
        correctIndex: options.findIndex((o) => o.correct)
      };
    }

    function buildFlagCountQuestion(index) {
      const version = QUIZ_SCOPE_VERSION;
      const flags = index.byVersion.get(version);
      if (!flags?.length) return null;

      const correctCount = flags.length;
      const distractorCounts = LTS_VERSIONS.filter((v) => v !== version)
        .map((v) => index.byVersion.get(v)?.length)
        .filter((c) => c != null && c !== correctCount);
      const distractors = shuffle(distractorCounts).slice(0, 3);
      if (distractors.length < 3) return null;

      const options = shuffle([
        String(correctCount),
        ...distractors.map(String)
      ]);

      return {
        type: "flagCount",
        flagId: "_catalog",
        scopeVersion: version,
        prompt: `How many JVM flags are cataloged for <strong>Java ${version}</strong> on this site?`,
        flag: "",
        options,
        correctIndex: options.indexOf(String(correctCount))
      };
    }

    function questionDedupKey(q) {
      const scope = q.scopeVersion != null ? String(q.scopeVersion) : "";
      return `${q.type}|${q.flagId}|${scope}`;
    }

    const BALANCED_TYPES = [
      "versionPresence",
      "description",
      "flagFromDescription"
    ];

    function buildBalancedQuizPlan() {
      const counts = Object.fromEntries(BALANCED_TYPES.map((t) => [t, 2]));
      let remaining = TOTAL_QUESTIONS - 1 - BALANCED_TYPES.length * 2;
      while (remaining > 0) {
        for (const type of shuffle([...BALANCED_TYPES])) {
          if (remaining <= 0) break;
          counts[type]++;
          remaining--;
        }
      }
      const plan = ["flagCount"];
      for (const type of BALANCED_TYPES) {
        for (let i = 0; i < counts[type]; i++) plan.push(type);
      }
      return shuffle(plan);
    }

    function generateQuiz(index) {
      const builders = {
        versionPresence: () => buildVersionPresenceQuestion(index),
        description: () => buildDescriptionQuestion(index),
        flagFromDescription: () => buildFlagFromDescriptionQuestion(index),
        flagCount: () => buildFlagCountQuestion(index)
      };

      const plan = buildBalancedQuizPlan();
      const questions = [];
      const usedKeys = new Set();
      const maxAttemptsPerSlot = 50;

      for (const type of plan) {
        let added = false;
        for (let attempt = 0; attempt < maxAttemptsPerSlot && !added; attempt++) {
          const q = builders[type]();
          if (!q) continue;
          const key = questionDedupKey(q);
          if (usedKeys.has(key)) continue;
          usedKeys.add(key);
          questions.push(q);
          added = true;
        }
        if (!added) return questions;
      }
      return questions;
    }

    let activeQuiz = null;

    function bindQuizHost(appEl) {
      if (appEl.dataset.quizBound) return;
      appEl.dataset.quizBound = "1";
      appEl.addEventListener("click", (e) => {
        const answerBtn = e.target.closest(".answer-btn");
        if (answerBtn && activeQuiz) {
          activeQuiz.onAnswerClick(answerBtn);
          return;
        }
        if (e.target.closest("#play-again") && activeQuiz) {
          new QuizGame(appEl, activeQuiz.index);
        }
      });
    }

    class QuizGame {
      constructor(appEl, index) {
        this.app = appEl;
        this.index = index;
        this.questions = generateQuiz(index);
        this.current = 0;
        this.score = 0;
        this.answered = false;
        this.results = [];
        bindQuizHost(appEl);
        activeQuiz = this;
        this.render();
      }

      onAnswerClick(btn) {
        if (this.answered || btn.disabled) return;
        const selectedIndex = parseInt(btn.getAttribute("data-index"), 10);
        if (Number.isNaN(selectedIndex)) return;
        this.handleAnswer(selectedIndex);
      }

      render() {
        if (this.questions.length < TOTAL_QUESTIONS) {
          this.app.innerHTML =
            '<p class="loading error">Could not generate enough questions. Try refreshing.</p>';
          return;
        }

        if (this.current >= TOTAL_QUESTIONS) {
          this.renderResult();
          return;
        }

        const q = this.questions[this.current];
        const pct = ((this.current) / TOTAL_QUESTIONS) * 100;

        this.app.innerHTML = `
          <div class="progress-bar">
            <span class="score">Correct: ${this.score}</span>
            <span class="counter">${this.current + 1} / ${TOTAL_QUESTIONS}</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill"></div>
          </div>
          <article class="question-card">
            <p class="question-type">${TYPE_LABELS[q.type]}</p>
            <p class="question-prompt">${q.prompt}</p>
            ${q.flag ? `<p class="flag-display">${escapeHtml(q.flag)}</p>` : ""}
            <div class="answers" role="group" aria-label="Answer choices">
              ${q.options
                .map(
                  (opt, i) =>
                    `<button type="button" class="answer-btn" data-index="${i}">${escapeHtml(opt)}</button>`
                )
                .join("")}
            </div>
          </article>
        `;
        const progressFill = this.app.querySelector(".progress-fill");
        if (progressFill) progressFill.style.width = `${pct}%`;
      }

      handleAnswer(selectedIndex) {
        if (this.answered) return;
        this.answered = true;

        const q = this.questions[this.current];
        const correct = selectedIndex === q.correctIndex;
        if (correct) this.score++;

        const correctAnswer = q.options[q.correctIndex];

        this.results.push({
          correct,
          questionNumber: this.current + 1,
          question: q,
          userAnswer: q.options[selectedIndex],
          correctAnswer
        });

        this.current++;
        this.answered = false;
        this.render();
      }

      renderReviewItems(failures) {
        return failures
          .map((r) => {
            const prompt = r.question.prompt.replace(/<\/?strong>/g, "");
            return `
          <li class="review-item">
            <div class="review-meta">
              <span class="review-q">Q${r.questionNumber}</span>
              <span class="review-type">${TYPE_LABELS[r.question.type]}</span>
            </div>
            ${r.question.flag ? `<p class="review-flag">${escapeHtml(r.question.flag)}</p>` : ""}
            <p class="review-prompt">${escapeHtml(prompt)}</p>
            <div class="review-answers">
              <p class="your-answer"><span class="label">Yours</span>${escapeHtml(r.userAnswer)}</p>
              <p class="correct-answer"><span class="label">Correct</span>${escapeHtml(r.correctAnswer)}</p>
            </div>
          </li>`;
          })
          .join("");
      }

      renderResult() {
        const won = this.score >= WIN_THRESHOLD;
        const failures = this.results.filter((r) => !r.correct);
        const hasReview = failures.length > 0;

        this.app.innerHTML = `
          <article class="question-card result-card${hasReview ? " has-review" : ""}">
            <div class="result-header">
              <p class="result-icon" aria-hidden="true">${won ? "🏆" : "📚"}</p>
              <h2 class="result-title ${won ? "win" : "lose"}">${won ? "You win!" : "Keep practicing"}</h2>
              <p class="result-score">You scored <strong>${this.score} / ${TOTAL_QUESTIONS}</strong>${won ? "" : ` — need ${WIN_THRESHOLD} to pass the quiz`}.</p>
            </div>
            ${
              hasReview
                ? `<section class="review-section" aria-label="Review incorrect answers">
                <h3>${failures.length === 1 ? "1 question to review" : `${failures.length} questions to review`}</h3>
                <ol class="review-list">${this.renderReviewItems(failures)}</ol>
              </section>`
                : `<p class="result-score result-score--perfect">Perfect run — every answer was correct.</p>`
            }
            <div class="result-actions">
              <button type="button" class="btn-graph" id="play-again">Play again</button>
              <a class="btn-graph btn-secondary" href="index.html">Back</a>
            </div>
          </article>
        `;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function init() {
      const app = document.getElementById("app");
      try {
        const versionData = await Promise.all(
          LTS_VERSIONS.map(async (version) => {
            const res = await fetch(`json/java-${version}.json`);
            if (!res.ok) throw new Error(`Failed to load Java ${version} data`);
            const data = await res.json();
            return { version, data };
          })
        );
        const index = buildFlagIndex(versionData);
        new QuizGame(app, index);
      } catch (err) {
        app.innerHTML = `<p class="loading error">${escapeHtml(err.message)}</p>`;
      }
    }

    init();
  </script>

</body>
</html>
