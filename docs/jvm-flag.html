<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVM Flag - Description</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" type="image/png" href="images/java-icon.png">
</head>
<body class="page-jvm-flag">
  <header>
    <a id="back-graph" href="java-version.html" class="back-link">← Back</a>
    <h1><span id="title-version">Java</span> JVM Flag</h1>
  </header>

  <main id="content">
    <p class="error">Loading…</p>
  </main>

  <script>
    const DEFAULT_JAVA = "25";
    const DEFAULT_JVM = "hotspot";
    const JVM_FILTER_VALUES = ["hotspot", "graalvm"];

    function resolveJavaVersion() {
      const java = new URLSearchParams(window.location.search).get("java");
      if (java == null || String(java).trim() === "") return DEFAULT_JAVA;
      const version = String(java).trim();
      return /^\d+$/.test(version) ? version : DEFAULT_JAVA;
    }

    function resolveFlagId() {
      const flag = new URLSearchParams(window.location.search).get("flag");
      return flag == null ? "" : String(flag).trim();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const JAVA_VERSION = resolveJavaVersion();
    const FLAG_ID = resolveFlagId();
    const DATA_URL = `json/java-${JAVA_VERSION}.json`;

    const jvmParam = urlParams.get("jvm");
    const JVM_FILTER =
      jvmParam != null && JVM_FILTER_VALUES.includes(String(jvmParam).trim().toLowerCase())
        ? String(jvmParam).trim().toLowerCase()
        : DEFAULT_JVM;

    function jvmFilterLabel() {
      return JVM_FILTER === "graalvm" ? "GraalVM" : "HotSpot";
    }

    function graphBackHref() {
      const params = new URLSearchParams();
      params.set("java", JAVA_VERSION);
      if (JVM_FILTER !== DEFAULT_JVM) {
        params.set("jvm", JVM_FILTER);
      }
      const query = params.toString();
      return `java-version.html?${query}`;
    }

    document.getElementById("title-version").textContent =
      `Java ${JAVA_VERSION} · ${jvmFilterLabel()}`;
    document.getElementById("back-graph").href = graphBackHref();

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildParentMap(edges) {
      const parent = new Map();
      for (const e of edges) {
        parent.set(e.target, e.source);
      }
      return parent;
    }

    function buildBreadcrumb(flagNode, nodesById, parentByTarget) {
      const parts = [];
      let cur = parentByTarget.get(flagNode.id);
      while (cur && cur !== "root") {
        const node = nodesById.get(cur);
        if (node) parts.unshift(node.label);
        cur = parentByTarget.get(cur);
      }
      return parts.length ? parts.join(" › ") : "";
    }

    function findSubcategoryLabel(flagNode, nodesById, parentByTarget) {
      let cur = parentByTarget.get(flagNode.id);
      while (cur && cur !== "root") {
        const node = nodesById.get(cur);
        if (node?.type === "subcategory") return node.label;
        cur = parentByTarget.get(cur);
      }
      return "";
    }

    function showError(html) {
      document.getElementById("content").innerHTML = `<p class="error">${html}</p>`;
    }

    function flagJvmImplementations(flag) {
      const jvm = flag.jvm;
      if (!Array.isArray(jvm) || jvm.length === 0) {
        return [DEFAULT_JVM];
      }
      return jvm.filter(id => JVM_FILTER_VALUES.includes(id));
    }

    function flagSupportsJvm(flag, implementation) {
      return flagJvmImplementations(flag).includes(implementation);
    }

    function findFlagNode(nodes, flagParam) {
      const needle = String(flagParam).trim();
      if (!needle) return null;
      return nodes.find(n => {
        if (n.type !== "flag") return false;
        if (n.flagId === needle || n.id === needle) return true;
        const display = n.flag || n.label;
        return display === needle;
      }) || null;
    }

    function buildJvmBadgesHtml(flag) {
      const implementations = flagJvmImplementations(flag);
      const badges = JVM_FILTER_VALUES.map(id => {
        const supported = implementations.includes(id);
        const label = id === "graalvm" ? "GraalVM" : "HotSpot";
        const active = supported ? " active" : "";
        const muted = supported ? "" : " jvm-badge--muted";
        return `<span class="jvm-badge jvm-badge--${id}${active}${muted}" title="${supported ? "Supported" : "Not in catalog for this flag"}">${label}</span>`;
      });
      return `<div class="jvm-badges" aria-label="JVM implementations">${badges.join("")}</div>`;
    }

    function buildJvmNoticeHtml(flag) {
      if (flagSupportsJvm(flag, JVM_FILTER)) return "";
      const supported = flagJvmImplementations(flag)
        .map(id => (id === "graalvm" ? "GraalVM" : "HotSpot"))
        .join(" and ");
      return `<p class="jvm-notice" role="status">This flag is cataloged for <strong>${escapeHtml(supported || "other JVMs")}</strong>, not ${escapeHtml(jvmFilterLabel())}. You opened the page with <code>jvm=${escapeHtml(JVM_FILTER)}</code>.</p>`;
    }

    function buildSearchPrompt(flag, breadcrumb) {
      const name = flag.flag || flag.label;
      const jvmLine = flagJvmImplementations(flag)
        .map(id => (id === "graalvm" ? "GraalVM" : "HotSpot"))
        .join(", ");
      const lines = [
        `I need detailed information about the following JVM flag for Java ${JAVA_VERSION} (${jvmLine}):`,
        "",
        `Flag: ${name}`,
      ];
      if (breadcrumb) lines.push(`Category: ${breadcrumb}`);
      if (flag.description) {
        lines.push("", "Known summary:", flag.description);
      }
      lines.push(
        "",
        "Please explain:",
        "- What this flag does and when to use it",
        "- Default value (if applicable) and valid syntax",
        "- Performance, memory, or compatibility implications",
        `- Whether it changed or was added/removed across Java versions (especially vs Java ${JAVA_VERSION})`,
        "- Links to official Oracle/OpenJDK documentation if available"
      );
      return lines.join("\n");
    }

    async function copyPrompt(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    function fitPromptHeight(ta) {
      ta.style.height = "auto";
      ta.style.height = `${ta.scrollHeight}px`;
    }

    function setupCopyButton() {
      const btn = document.getElementById("copy-prompt");
      const ta = document.getElementById("search-prompt");
      const status = document.getElementById("copy-status");
      if (!btn || !ta) return;

      fitPromptHeight(ta);
      ta.addEventListener("input", () => fitPromptHeight(ta));
      window.addEventListener("resize", () => fitPromptHeight(ta), { passive: true });

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await copyPrompt(ta.value);
          status.textContent = "Copied to clipboard.";
        } catch {
          status.textContent = "Copy failed — select the text and copy manually.";
        } finally {
          btn.disabled = false;
          setTimeout(() => { status.textContent = ""; }, 2500);
        }
      });
    }

    function renderFlag(flag, breadcrumb, subcategoryLabel) {
      document.title = `${flag.flag || flag.label} — Java ${JAVA_VERSION} · ${jvmFilterLabel()}`;
      const desc = flag.description
        ? `<p class="description">${escapeHtml(flag.description)}</p>`
        : `<p class="description empty">No description available for this flag.</p>`;
      const prompt = buildSearchPrompt(flag, breadcrumb);
      const backHref = graphBackHref();

      document.getElementById("content").innerHTML = `
        ${breadcrumb ? `<p class="breadcrumb breadcrumb-full">${escapeHtml(breadcrumb)}</p>` : ""}
        ${subcategoryLabel ? `<p class="breadcrumb breadcrumb-mobile">${escapeHtml(subcategoryLabel)}</p>` : ""}
        <p class="flag-name">${escapeHtml(flag.flag || flag.label)}</p>
        ${buildJvmBadgesHtml(flag)}
        ${buildJvmNoticeHtml(flag)}
        <h2 class="section-title">Description</h2>
        ${desc}
        <section class="research" aria-labelledby="research-title">
          <h2 class="section-title" id="research-title">Search for further information</h2>
          <p class="research-hint">Copy this prompt into your preferred search or AI assistant to learn more about this flag.</p>
          <textarea id="search-prompt" class="research-prompt" rows="1" aria-label="Search prompt">${escapeHtml(prompt)}</textarea>
          <div class="research-actions">
            <button type="button" id="copy-prompt" class="btn-graph">Copy to clipboard</button>
            <a class="btn-graph btn-secondary" href="${backHref}">Back</a>
            <span id="copy-status" class="copy-status" role="status" aria-live="polite"></span>
          </div>
        </section>
      `;
      setupCopyButton();
    }

    if (!FLAG_ID) {
      showError("Missing <code>flag</code> query parameter.");
    } else {
      fetch(DATA_URL)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(data => {
          const nodes = data.nodes || [];
          const edges = data.edges || [];
          const flag = findFlagNode(nodes, FLAG_ID);
          if (!flag) {
            showError(
              `Flag not found for <code>flag=${escapeHtml(FLAG_ID)}</code> in Java ${JAVA_VERSION} (${escapeHtml(jvmFilterLabel())}).`
            );
            return;
          }
          const nodesById = new Map(nodes.map(n => [n.id, n]));
          const parentByTarget = buildParentMap(edges);
          const breadcrumb = buildBreadcrumb(flag, nodesById, parentByTarget);
          const subcategoryLabel = findSubcategoryLabel(flag, nodesById, parentByTarget);
          renderFlag(flag, breadcrumb, subcategoryLabel);
        })
        .catch(() => {
          showError(
            `Could not load <code>${escapeHtml(DATA_URL)}</code>.<br>` +
            `Serve the <code>docs/</code> folder over HTTP, then open this page with valid <code>java</code> and <code>flag</code> parameters.`
          );
        });
    }
  </script>

</body>
</html>
